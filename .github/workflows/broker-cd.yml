name: GearFlow CD

on:
  workflow_run:
    workflows: [Broker CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gearflow-academy-environment
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require successful CI for exact commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml',
              head_sha: process.env.VALIDATED_SHA, branch: 'main', status: 'success', per_page: 100
            });
            if (!data.workflow_runs.some(run => ['push', 'workflow_dispatch'].includes(run.event))) {
              core.setFailed('Execute Broker CI com sucesso para este commit da main antes do deploy.');
            }

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'gearflow' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'messaging' }}
      AWS_PAGER: ''
    steps:
      - name: Initialize isolated runner files
        shell: bash
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/gearflow-kubeconfig" >> "$GITHUB_ENV"

      - name: Checkout exact validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate organization variables
        shell: bash
        run: |
          test "$AWS_REGION" = us-east-1
          test "$EKS_CLUSTER_NAME" = gearflow
          test "$K8S_NAMESPACE" = messaging

      - name: Authenticate using temporary Academy credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Read cluster Kubernetes version
        run: |
          version=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query cluster.version --output text)
          echo "KUBECTL_VERSION=v$version.0" >> "$GITHUB_ENV"

      - name: Install compatible kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure isolated Kubernetes context
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG" --alias gearflow-cd

      - name: Bootstrap, deploy and verify broker
        run: python scripts/cd/deploy_broker.py --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --namespace "$K8S_NAMESPACE"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc -n "$K8S_NAMESPACE" || true
          kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp | tail -40 || true
